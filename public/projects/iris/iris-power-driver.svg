<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#06090f"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(245, 158, 11, 0.05)" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="30" y="25" width="740" height="36" rx="4" fill="#10192b" stroke="#253553" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#ef4444"/>
  <circle cx="68" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="43" r="5" fill="#10b981"/>
  <text x="110" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">IRIS DUAL-TIER ELECTRICAL &amp; MOTOR CONTROLLER TOPOLOGY</text>
  <text x="750" y="48" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">~10A DISCRETE H-BRIDGE</text>

  <!-- High-Level Host -->
  <rect x="40" y="90" width="200" height="130" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="50" y="100" width="180" height="24" rx="3" fill="#1e293b"/>
  <text x="140" y="116" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">INTEL i7 ONBOARD HOST</text>
  <text x="55" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="11">• OpenCV Camera Vision</text>
  <text x="55" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Voice &amp; Audio Processing</text>
  <text x="55" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Navigation Telemetry</text>
  <text x="55" y="205" fill="#94a3b8" font-family="sans-serif" font-size="10">High-Level Control Bus</text>

  <!-- Arrow Host to Mega -->
  <path d="M 240 155 L 290 155" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="265" y="145" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">UART/USB</text>

  <!-- Real-Time Microcontroller -->
  <rect x="290" y="90" width="220" height="220" rx="6" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="300" y="100" width="200" height="24" rx="3" fill="#064e3b"/>
  <text x="400" y="116" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">ARDUINO MEGA 2560</text>
  <text x="305" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Differential Drive Kinematics</text>
  <text x="305" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Ultrasonic Sensor Array (HC-SR04)</text>
  <text x="305" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Head/Arm Servo PWM (PCA9685)</text>
  <text x="305" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 20x4 LCD Telemetry &amp; RGB Eyes</text>
  <text x="305" y="235" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">Real-Time Sensor Loop: 50Hz</text>
  <text x="305" y="255" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">PWM Frequency: 20kHz Silent</text>

  <!-- Power Stage -->
  <rect x="560" y="90" width="200" height="220" rx="6" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="570" y="100" width="180" height="24" rx="3" fill="#78350f"/>
  <text x="660" y="116" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">~10A MOTOR DRIVER STAGE</text>
  <text x="575" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 4x IRF3205 N-MOSFETs</text>
  <text x="575" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 2x IR2104 Gate Driver ICs</text>
  <text x="575" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Bootstrap High-Side Float</text>
  <text x="575" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Shunt Resistor Current Sense</text>
  <text x="575" y="235" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10">Ratings: 55V, 110A Max Pulsed</text>
  <text x="575" y="255" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Continuous: ~10A Heavy Load</text>

  <!-- Lines from Mega to Driver -->
  <path d="M 510 155 L 560 155" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="535" cy="155" r="3" fill="#f59e0b"/>
  <text x="535" y="145" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">PWM + DIR</text>

  <!-- Differential Motors -->
  <rect x="560" y="340" width="200" height="75" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="660" y="365" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">DIFFERENTIAL DRIVE MOTORS</text>
  <text x="660" y="385" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Dual High-Torque Geared DC Planetary Units</text>
  <text x="660" y="402" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Left Motor (M1) | Right Motor (M2)</text>
  <path d="M 660 310 L 660 340" stroke="#f59e0b" stroke-width="2"/>

  <!-- Battery Pack -->
  <rect x="40" y="260" width="200" height="155" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="50" y="270" width="180" height="24" rx="3" fill="#7c2d12"/>
  <text x="140" y="286" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">12.6V 36Ah CUSTOM BATTERY</text>
  <text x="55" y="315" fill="#fed7aa" font-family="sans-serif" font-size="11">• Recovered 18650 Li-Ion Cells</text>
  <text x="55" y="335" fill="#fed7aa" font-family="sans-serif" font-size="11">• Internal Resistance Tested &amp; Matched</text>
  <text x="55" y="355" fill="#fed7aa" font-family="sans-serif" font-size="11">• Custom 3S High-Capacity Pack</text>
  <text x="55" y="375" fill="#fed7aa" font-family="sans-serif" font-size="11">• Integrated BMS &amp; Cell Balancer</text>
  <text x="55" y="398" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10">Nominal 11.1V / Peak 12.6V</text>

  <path d="M 240 340 L 400 340 L 400 310" stroke="#ea580c" stroke-width="2" stroke-dasharray="3"/>
  <path d="M 240 360 L 560 360 L 560 310" stroke="#ea580c" stroke-width="2"/>
  <text x="350" y="355" fill="#ea580c" font-family="'JetBrains Mono', monospace" font-size="9">12V DC POWER BUS</text>
</svg>
